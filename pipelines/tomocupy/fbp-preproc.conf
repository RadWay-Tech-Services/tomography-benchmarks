[general]
logs-home = tomocupy-logs
verbose = True
config-update = False

[file-reading]
file-name = synthetic.nx
# flat-file-name = 
# dark-file-name = 
# out-path-name = 
file-type = standard
binning = 0
blocked-views = none

[remove-stripe]
remove-stripe-method = fw

[fw]
fw-sigma = 2
fw-filter = db5
fw-level = 7
fw-pad = True

[vo-all]
vo-all-snr = 3
vo-all-la-size = 61
vo-all-sm-size = 21
vo-all-dim = 1

[ti]
ti-beta = 0.022
ti-mask = 1

[retrieve-phase]
retrieve-phase-method = paganin
energy = 53
propagation-distance = 0.3
retrieve-phase-alpha = 1
retrieve-phase-delta-beta = 10.0
retrieve-phase-w = 0.0002
retrieve-phase-pad = 1
ffratio = 100
ffdim = 2
fflog = 0
ffpad = 150

[rotate-proj]
rotate-proj-angle = 0
rotate-proj-order = 1

[lamino]
lamino-search-width = 5.0
lamino-search-step = 0.25
lamino-angle = 0
lamino-start-row = 0
lamino-end-row = -1

[reconstruction-types]
reconstruction-type = full
reconstruction-algorithm = fourierrec

[reconstruction-steps-types]
reconstruction-type = full
reconstruction-algorithm = fourierrec
pre-processing = True

[reconstruction]
rotation-axis = -1.0
center-search-width = 50.0
center-search-step = 0.5
nsino = 0.5
nsino-per-chunk = 8
nproj-per-chunk = 8
start-row = 0
end-row = -1
start-column = 0
end-column = -1
start-proj = 0
end-proj = -1
rotation-axis-auto = manual
rotation-axis-pairs = [0,0]
rotation-axis-sift-threshold = 0.5
rotation-axis-method = sift
find-center-start-row = 0
find-center-end-row = -1
fbp-filter = parzen
dezinger = 1
dezinger-threshold = 5000
max-write-threads = 8
max-read-threads = 4
minus-log = False
flat-linear = False
bright-ratio = 1
pixel-size = 1.3

[output]
dtype = float32
save-format = h5nolinks
zarr-compression = blosclz
zarr-chunk = 8,64,64
large-data = False
ldchunk = 10
clear-folder = False

[beam-hardening]
beam-hardening-method = none
source-distance = 36.0
read-scintillator = False
read-pixel-size = False
scintillator-material = LuAG_Ce
scintillator-thickness = 100.0
scintillator-density = 6.0
sample-material = Fe
sample-density = 1.0
filter-1-auto = False
filter-1-material = none
filter-1-thickness = 0.0
filter-1-density = 1.0
filter-2-auto = False
filter-2-material = none
filter-2-thickness = 0.0
filter-2-density = 1.0
filter-3-auto = False
filter-3-material = none
filter-3-thickness = 0.0
filter-3-density = 1.0
calculate-source = none
e-storage-ring = 7.0
b-storage-ring = 0.599
minimum-e = 1000
maximum-e = 200000
step-e = 500
maximum-psi-urad = 40

[inference]
infer-seed-number = 10
infer-input-data-type = raw
infer-use-8bits = True
#infer-downsample-factor = [1]
#infer-num-windows = [3]
#infer-window-size = [518]
infer-model-path = none
infer-input-dir = none
infer-save-intermediate-data = False
# infer-batch-list = 
# infer-out-dir-name = 

